[package]
name = "sq"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
fundsp = "0.23.0"
rfd = "0.18.0"
rubato = "5.1.0"
slint = "1.19.0"
symphonia = { version = "0.6.1", features = ["all"] }
